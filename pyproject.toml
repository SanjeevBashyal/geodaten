[build-system]
requires = ["setuptools>=77,<82"]
build-backend = "setuptools.build_meta"

[project]
name = "geodaten"
dynamic = ["version"]
description = "Download spatial and temporal subsets of global geospatial datasets"
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
    { name = "Sanjeev Bashyal", email = "sanjeev.bashyal@ufz.de" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "netCDF4>=1.6.5",
    "numpy>=1.26",
    "pyproj>=3.6",
    "rasterio>=1.3.9",
    "requests>=2.31",
]

[project.optional-dependencies]
zenodo = ["remotezip>=0.12"]
earthdata = ["earthaccess>=0.18"]
cdse = ["boto3>=1.34"]
destine = [
    "earthkit-data[polytope]>=1.1",
    "earthkit-regrid>=0.4",
    "scipy>=1.11",
]
tui = ["textual>=1,<9"]
gui = ["qtpy>=2.4"]
gui-pyside6 = ["qtpy>=2.4", "PySide6>=6.7"]
all = [
    "boto3>=1.34",
    "earthaccess>=0.18",
    "earthkit-data[polytope]>=1.1",
    "earthkit-regrid>=0.4",
    "qtpy>=2.4",
    "remotezip>=0.12",
    "scipy>=1.11",
    "textual>=1,<9",
]
test = [
    "pytest>=7.4",
    "pytest-cov>=4",
]

[project.scripts]
geodaten = "geodaten.cli:main"
geodaten-tui = "geodaten.cli:tui_entry"

[project.gui-scripts]
geodaten-gui = "geodaten.cli:gui_entry"

[project.urls]
Homepage = "https://github.com/SanjeevBashyal/geodaten"

[tool.setuptools.packages.find]
include = ["geodaten*"]

[tool.setuptools.dynamic]
version = { attr = "geodaten._version.__version__" }

[tool.setuptools.package-data]
"geodaten.gui" = ["*.ui"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["."]
testpaths = ["tests"]
